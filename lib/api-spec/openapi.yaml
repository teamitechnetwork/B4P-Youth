openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: B4P Youth API. Member routes require an active signed-in youth account; /admin routes require an active administrator. About and contact submission are open.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public
  - name: profile
  - name: opportunities
  - name: programs
  - name: events
  - name: notifications
  - name: applications
  - name: updates
  - name: contact
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [profile]
      summary: Get youth dashboard content and their current applications
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the signed-in youth profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMyProfile
      tags: [profile]
      summary: Update the signed-in youth profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /me/applications:
    get:
      operationId: listMyApplications
      tags: [programs, profile]
      summary: List program applications belonging to the signed-in youth
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramApplication"
  /me/application-submissions:
    get:
      operationId: listMyApplicationSubmissions
      tags: [applications, profile]
      summary: List application form submissions belonging to the signed-in youth
      responses:
        "200":
          description: Application form submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyApplicationSubmission"
  /applications:
    get:
      operationId: listApplicationForms
      tags: [applications]
      summary: List published application forms
      parameters:
        - in: query
          name: programId
          schema: { type: integer }
      responses:
        "200":
          description: Published application forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationForm"
  /applications/{id}:
    get:
      operationId: getApplicationForm
      tags: [applications]
      summary: Get a published application form and its questions
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Application form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationForm"
        "404": { $ref: "#/components/responses/NotFound" }
  /applications/{id}/submissions:
    post:
      operationId: submitApplicationForm
      tags: [applications]
      summary: Submit answers to a published application form
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationSubmissionInput"
      responses:
        "201":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSubmissionReceipt"
        "409": { $ref: "#/components/responses/Conflict" }
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List published opportunities
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/OpportunityCategory"
      responses:
        "200":
          description: Matching opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get a published opportunity
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "404": { $ref: "#/components/responses/NotFound" }
  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List published programs
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Matching programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
  /programs/{id}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get a published program
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404": { $ref: "#/components/responses/NotFound" }
  /programs/{id}/applications:
    post:
      operationId: submitProgramApplication
      tags: [programs]
      summary: Apply to a published program
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramApplicationInput"
      responses:
        "201":
          description: Submitted application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramApplication"
        "409": { $ref: "#/components/responses/Conflict" }
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List published events
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Matching events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a published event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{id}/registrations:
    post:
      operationId: registerForEvent
      tags: [events]
      summary: Register the signed-in youth for an event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Event registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistration"
        "409": { $ref: "#/components/responses/Conflict" }
  /updates:
    get:
      operationId: listUpdates
      tags: [updates]
      summary: List published B4P updates
      responses:
        "200":
          description: Published updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Update"
  /me/notifications:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      summary: List notifications for the signed-in youth
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /me/notifications/{id}:
    patch:
      operationId: markMyNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadUpdate"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /about:
    get:
      operationId: getAbout
      tags: [public]
      summary: Get public organization information and contact details
      responses:
        "200":
          description: B4P CODEFOUND information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
  /contact-messages:
    post:
      operationId: sendContactMessage
      tags: [contact]
      summary: Send a message to B4P CODEFOUND
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessageReceipt"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get administrator dashboard counts and recent applications
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Search and list youth accounts
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [admin]
      summary: View a youth account
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    patch:
      operationId: updateUserStatus
      tags: [admin]
      summary: Activate or deactivate a youth account
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /admin/opportunities:
    get:
      operationId: listAdminOpportunities
      tags: [admin, opportunities]
      summary: List all opportunities, including drafts
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [admin, opportunities]
      summary: Create an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
  /admin/opportunities/{id}:
    patch:
      operationId: updateOpportunity
      tags: [admin, opportunities]
      summary: Edit or publish an opportunity
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityUpdate"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
    delete:
      operationId: deleteOpportunity
      tags: [admin, opportunities]
      summary: Delete an opportunity
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Opportunity deleted }
  /admin/programs:
    get:
      operationId: listAdminPrograms
      tags: [admin, programs]
      summary: List all programs, including drafts
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
    post:
      operationId: createProgram
      tags: [admin, programs]
      summary: Create a B4P program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInput"
      responses:
        "201":
          description: Created program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
  /admin/programs/{id}:
    patch:
      operationId: updateProgram
      tags: [admin, programs]
      summary: Edit or publish a program
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
    delete:
      operationId: deleteProgram
      tags: [admin, programs]
      summary: Delete a program
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Program deleted }
  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin, programs]
      summary: Search and filter all program applications
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
      responses:
        "200":
          description: Applications with applicant profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminApplication"
  /admin/applications/{id}:
    patch:
      operationId: updateApplication
      tags: [admin, programs]
      summary: Update an application status and optional admin note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplication"
  /admin/application-forms:
    get:
      operationId: listAdminApplicationForms
      tags: [admin, applications]
      summary: List application forms, including drafts
      responses:
        "200":
          description: Application forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationForm"
    post:
      operationId: createApplicationForm
      tags: [admin, applications]
      summary: Create an application form with custom questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationFormInput"
      responses:
        "201":
          description: Created application form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationForm"
  /admin/application-forms/{id}:
    patch:
      operationId: updateApplicationForm
      tags: [admin, applications]
      summary: Edit, publish or unpublish an application form
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationFormUpdate"
      responses:
        "200":
          description: Updated application form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationForm"
    delete:
      operationId: deleteApplicationForm
      tags: [admin, applications]
      summary: Delete an application form while retaining submitted records
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Application form deleted }
  /admin/application-submissions:
    get:
      operationId: listAdminApplicationSubmissions
      tags: [admin, applications]
      summary: Search and filter application form submissions
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - in: query
          name: formId
          schema: { type: integer }
      responses:
        "200":
          description: Submissions with applicant details and saved answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminApplicationSubmission"
  /admin/application-submissions/{id}:
    patch:
      operationId: updateApplicationSubmission
      tags: [admin, applications]
      summary: Update a submission status and internal note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationSubmissionUpdate"
      responses:
        "200":
          description: Updated application submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationSubmission"
  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin, events]
      summary: List all events, including drafts
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [admin, events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /admin/events/{id}:
    patch:
      operationId: updateEvent
      tags: [admin, events]
      summary: Edit or publish an event
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [admin, events]
      summary: Delete an event
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Event deleted }
  /admin/updates:
    get:
      operationId: listAdminUpdates
      tags: [admin, updates]
      summary: List updates, including drafts
      responses:
        "200":
          description: Updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Update"
    post:
      operationId: createUpdate
      tags: [admin, updates]
      summary: Create and optionally publish an update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInput"
      responses:
        "201":
          description: Created update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Update"
  /admin/updates/{id}:
    patch:
      operationId: updateUpdate
      tags: [admin, updates]
      summary: Edit, publish or unpublish an update
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUpdate"
      responses:
        "200":
          description: Updated update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Update"
    delete:
      operationId: deleteUpdate
      tags: [admin, updates]
      summary: Delete an update
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Update deleted }
  /admin/event-registrations:
    get:
      operationId: listEventRegistrations
      tags: [admin, events]
      summary: View event registrations
      parameters:
        - in: query
          name: eventId
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Event registrations with attendee profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEventRegistration"
  /admin/notifications:
    post:
      operationId: publishNotification
      tags: [admin, notifications]
      summary: Publish an announcement notification to all active youth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationInput"
      responses:
        "201":
          description: Published notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReceipt"
  /admin/contact-messages:
    get:
      operationId: listContactMessages
      tags: [admin, contact]
      summary: List messages submitted through the public contact form
      responses:
        "200":
          description: Contact messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"
  /admin/contact-messages/{id}:
    patch:
      operationId: updateContactMessage
      tags: [admin, contact]
      summary: Update the handling status of a contact message
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageUpdate"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get editable organization and contact information
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Edit About B4P and contact information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    NotFound:
      description: Record not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate or conflicting request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    OpportunityCategory:
      type: string
      enum: [Jobs, Internships, Scholarships, Fellowships, Trainings, Grants, Volunteer, Other]
    ApplicationQuestionType:
      type: string
      enum: [short_text, long_text, email, phone, dropdown, multiple_choice, checkbox, date]
    ApplicationStatus:
      type: string
      enum: [Submitted, Under Review, Accepted, Rejected]
    UpdateCategory:
      type: string
      enum: [Announcement, News, Important notice, Program update, Opportunity update, Event reminder]
    UserProfile:
      type: object
      required: [id, fullName, email, phone, gender, country, county, city, dateOfBirth, educationLevel, interests, imageUrl, active, createdAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        gender: { type: string }
        country: { type: string }
        county: { type: string }
        city: { type: string }
        dateOfBirth: { type: string, format: date }
        educationLevel: { type: string }
        interests:
          type: array
          items: { type: string }
        imageUrl: { type: ["string", "null"], format: uri }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      required: [fullName, phone, gender, country, county, city, dateOfBirth, educationLevel, interests]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: string, minLength: 1, maxLength: 40 }
        gender: { type: string, maxLength: 50 }
        country: { type: string, minLength: 1, maxLength: 100 }
        county: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
        educationLevel: { type: string, maxLength: 120 }
        interests:
          type: array
          items: { type: string, maxLength: 100 }
    Opportunity:
      type: object
